<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="navbar-nav d-flex flex-row">
            <a class="nav-link mx-3">書籍一覧</a>
            <a class="nav-link mx-3">書籍登録</a>
        </div>

        <div class="navbar-nav d-flex flex-row">
            {% block nav_right %}
            {% if user.is_authenticated %}
            <a class="nav-link mx-3" href="{% url 'accounts:signup' %}">新規アカウント作成</a>
            {% else %}
            <a class="nav-link mx-3" href="{% url 'accounts:login' %}">ログイン</a>
            {% endif %}
            {% endblock %}
        </div>
    </nav>

    {% block form_area %}
    <h1 class="m-4">ログイン</h1>
    <form method="post" class="p-4 m-4 bg-light border border-success rounded form-group">
        {% csrf_token %}
        {% for error in form.errors.values %}
        <div class="alert alert-danger py-2 mb-3">
            <p class="mb-0 small font-weight-bold">ユーザーID、またはパスワードが間違っています。</p>
        </div>
        {% endfor %}
        <label>ID</label>
        <input type="text" name="username" class="form-control mb-4" placeholder="ユーザー ID"
            value="{{ form.username.value|default_if_none:'' }}" required>
        <label>Ps</label>
        <input type="text" name="password" class="form-control mb-4" placeholder="パスワード" required>

        <button type="submit" class="btn btn-success mt-4">ログイン</button>
    </form>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
