<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本棚アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  {% extends 'base.html' %}

  {% block title %}書籍一覧{% endblock %}
  {% block h1 %}書籍一覧{% endblock %}

  {% block content %}
    {% for item in object_list %}
    <div class="p-4 m-4 bg-light border border-body-secondary rounded shadow">
      <h2 class="text-success">{{ item.title }}</h2>
      <h6 class="カテゴリ :{{ item.category }}">{{ item.category }}</h6>
      <div class="mt-3">
        <a href="{% url 'detail-book' item.pk %}">詳細へ</a>
      </div>
    </div>
    {% endfor %}
  {% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
