{% extends 'base.html' %}

{% block title %}書籍修正{% endblock %}

{% block content %}
<div class="p-4 rounded shadow my-4 border border-success">
  <h4 class="mb-4 fw-bold text-dark">書籍の修正</h4>
  <form method="POST">{% csrf_token %}
    {{form.as_p}}
    <div class="mt-4">
      <input type="submit" value="修正する" class="btn btn-outline-success m-2">
    </div>
  </form>
</div>
{% endblock %}
