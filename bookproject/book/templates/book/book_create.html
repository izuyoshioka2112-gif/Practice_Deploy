{% extends 'base.html' %}

{% block title %}書籍作成{% endblock %}

{% block content %}
<div class="p-4 rounded shadow my-4 border border-primary">
  <h4 class="mb-4 fw-bold text-dark ">書籍の作成</h4>

  </form>
</div>
{% endblock content %}
